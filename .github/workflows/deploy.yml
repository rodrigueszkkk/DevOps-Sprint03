name: Build and Push Docker Images to ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      acr_name:
        description: 'Nome do ACR (ex: acrpethealthrm561760)'
        required: false
        default: ''
      acr_username:
        description: 'ACR Username'
        required: false
        default: ''
      acr_password:
        description: 'ACR Password'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ inputs.acr_name || secrets.ACR_NAME }}
      ACR_USER: ${{ inputs.acr_username || secrets.ACR_USERNAME }}
      ACR_PASS: ${{ inputs.acr_password || secrets.ACR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          docker build -t pethealth-mysql:v1 -f database/Dockerfile.mysql database
          docker build -t pethealth-api:v1 -f Dockerfile .

      - name: Push Images to ACR
        if: env.ACR_USER != '' && env.ACR_PASS != '' && env.ACR_NAME != ''
        run: |
          echo "$ACR_PASS" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_USER" --password-stdin
          docker tag pethealth-mysql:v1 "$ACR_NAME.azurecr.io/pethealth-mysql:v1"
          docker tag pethealth-api:v1 "$ACR_NAME.azurecr.io/pethealth-api:v1"
          docker push "$ACR_NAME.azurecr.io/pethealth-mysql:v1"
          docker push "$ACR_NAME.azurecr.io/pethealth-api:v1"
