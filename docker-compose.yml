version: '3.8'

services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile.mysql
    container_name: pethealth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pethealth_db}
      MYSQL_USER: ${MYSQL_USER:-pethealth_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pethealth-api
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=database;Port=3306;Database=${MYSQL_DATABASE:-pethealth_db};User=${MYSQL_USER:-pethealth_user};Password=${MYSQL_PASSWORD};
    ports:
      - "8080:8080"

volumes:
  mysql_data:
    driver: local
