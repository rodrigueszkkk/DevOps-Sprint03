version: '3.8'

services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile.mysql
    container_name: pethealth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: PetHealth@2026
      MYSQL_DATABASE: pethealth_db
      MYSQL_USER: pethealth_user
      MYSQL_PASSWORD: PetHealthPass@2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pethealth_user", "-pPetHealthPass@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pethealth-api
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=database;Port=3306;Database=pethealth_db;User=pethealth_user;Password=PetHealthPass@2026;
    ports:
      - "8080:8080"

volumes:
  mysql_data:
    driver: local
